<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>霓潮 · 全息唤醒</title><link rel="stylesheet" href="/web/hologram.css"></head><body>
<main class="studio"><header><a href="/" class="brand">霓潮<span>全息相伴</span></a><span class="badge">8 帧 · Canvas 缓存</span></header>
<nav class="modes" aria-label="预览模式"><button id="mode-idle" type="button" aria-pressed="true" disabled>待机循环</button><button id="mode-intro" type="button" aria-pressed="false" disabled>开场演出</button></nav>
<section class="stage" aria-label="绿色全息大肥鱼动画预览"><canvas id="hologram" width="960" height="640" aria-label="绿色线稿大肥鱼托腮眨眼，鲸尾轻摆"></canvas><div class="stage-meta"><span>480 × 320</span><span id="frame-index">8 帧预缓存</span><span id="phase" aria-live="polite">正在缓存素材…</span></div></section>
<section class="controls" aria-label="动画播放控制"><div class="transport"><button id="play" type="button" disabled>播放</button><button id="replay" type="button" disabled>重播</button><label class="loop"><input id="loop" type="checkbox" checked disabled>循环</label><output id="time">0.0 / 3.0 秒</output></div><label class="timeline"><span class="sr-only">动画时间轴</span><input id="seek" type="range" min="0" max="3040" value="0" step="1" disabled></label><div class="options"><label>辉光<input id="glow" type="range" min="0" max="100" value="28" disabled></label><label>亮度<input id="brightness" type="range" min="45" max="100" value="100" disabled></label><label class="check"><input id="distortion" type="checkbox" checked disabled>开场局部错位</label></div><div id="frames" class="frames" aria-label="八帧逐帧查看"></div></section>
<footer><p>简化线稿 · 自然眨眼 · 轻微呼吸与鲸尾摆动<br>角色图集预加载后由 Canvas 播放，开场时间轴为演出预览。</p><a href="/">返回家园预览 ↗</a></footer>
</main><script type="module" src="/web/hologram-app.js"></script></body></html>
